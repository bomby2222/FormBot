name: Build FormBot macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build FormBot.app
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --windowed \
            --name "FormBot" \
            formbot_v6_4_10_submit_detector_v2.py

      - name: Check app
        run: |
          ls -la dist
          ls -la dist/FormBot.app

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent FormBot.app FormBot-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: FormBot-macOS
          path: dist/FormBot-macOS.zip