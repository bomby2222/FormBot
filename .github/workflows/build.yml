  build-macos:
    name: Build macOS APP
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # สำคัญ: ห้าม PLAYWRIGHT_BROWSERS_PATH=0 ตรงนี้
      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

          echo "Playwright browsers:"
          ls -la "$HOME/Library/Caches/ms-playwright"

      # Build เฉพาะตัวโปรแกรม + Playwright driver
      # Browser ยังไม่ถูกยัดเข้า PyInstaller
      - name: Build FormBot.app
        run: |
          rm -rf build dist FormBot.spec

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "FormBot" \
            --icon "icon.icns" \
            --collect-all playwright \
            main.py

      # เอา Chromium ใส่หลังจาก PyInstaller ทำงานเสร็จแล้ว
      - name: Bundle Chromium into FormBot.app
        run: |
          mkdir -p "dist/FormBot.app/Contents/Resources/ms-playwright"

          ditto \
            "$HOME/Library/Caches/ms-playwright" \
            "dist/FormBot.app/Contents/Resources/ms-playwright"

          echo "Bundled browsers:"
          du -sh "dist/FormBot.app/Contents/Resources/ms-playwright"

      # Ad-hoc sign สำหรับ artifact ทดสอบ
      - name: Ad-hoc sign FormBot
        run: |
          xattr -cr "dist/FormBot.app" || true

          find "dist/FormBot.app/Contents/Resources/ms-playwright" \
            -type f \
            -perm +111 \
            -exec codesign --force --sign - {} \; || true

          codesign \
            --force \
            --deep \
            --sign - \
            "dist/FormBot.app"

          codesign --verify --deep --strict "dist/FormBot.app"

      - name: Package macOS APP
        run: |
          cd dist

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "FormBot.app" \
            "FormBot-macOS.zip"

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: FormBot-macOS
          path: dist/FormBot-macOS.zip
          if-no-files-found: error