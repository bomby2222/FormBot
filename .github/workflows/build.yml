name: Build FormBot

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        shell: powershell
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build FormBot.exe
        shell: powershell
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "FormBot" `
            --icon "icon.ico" `
            --collect-all playwright `
            main.py

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: FormBot-Windows
          path: dist/FormBot/
          if-no-files-found: error


  # ============================================================
  # MACOS
  # ============================================================
  build-macos:
    name: Build macOS APP
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m playwright install chromium

      - name: Build FormBot.app
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "FormBot" \
            --icon "icon.icns" \
            --collect-all playwright \
            main.py

      - name: Package macOS APP
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent FormBot.app FormBot-macOS.zip

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: FormBot-macOS
          path: dist/FormBot-macOS.zip
          if-no-files-found: error